<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">Mobile Inventory</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172944"/>
      <stop offset="1" stop-color="#07152b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd34f"/>
      <stop offset="1" stop-color="#ff9417"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="42" fill="url(#bg)"/>
  <!-- Smartphone outline -->
  <path d="M125 190H84c-13 0-22-9-22-22V74c0-13 9-22 22-22h45c13 0 22 9 22 22v48"
        fill="none" stroke="#f7f9fc" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M96 63h24" stroke="#f7f9fc" stroke-width="6" stroke-linecap="round"/>
  <!-- Inventory list -->
  <g fill="#36a9ff">
    <rect x="157" y="72" width="58" height="10" rx="5"/>
    <rect x="157" y="93" width="58" height="10" rx="5"/>
    <rect x="157" y="114" width="58" height="10" rx="5"/>
  </g>
  <!-- Inventory box -->
  <g stroke="#ffb52b" stroke-linejoin="round" stroke-width="1.5">
    <path d="M112 145 154 125 202 146 160 168Z" fill="#ffd04a"/>
    <path d="M112 145 160 168V218L112 193Z" fill="url(#gold)"/>
    <path d="M160 168 202 146V192L160 218Z" fill="#ff9c1b"/>
    <path d="M132 136 179 157" fill="none" stroke="#fff0ad" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
