<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mobile Inventory</title>
        <!-- FAVICON LINK -->
        <link
            rel="shortcut icon"
            href="./mobile-inventory-favicon.svg"
            type="image/x-icon"
        />
        <!-- POPPINS FONT LINK -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
        <!-- LOCAL STYLING LINK -->
        <link rel="stylesheet" href="./styles/main.css" />
    </head>
    <body>
        <header>
            <div class="logo-title">
                <img src="./mobile-inventory-favicon.svg" alt="Logo" />
                <h1 class="page-title">Mobile Inventory</h1>
            </div>
            <button id="darkMode" class="button">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="1em"
                    height="1em"
                    viewBox="0 0 24 24"
                    class="dark-mode"
                >
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path
                        fill="currentColor"
                        d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26a5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1"
                    />
                </svg>
            </button>
        </header>
        <main>
            <div id="inputSection" class="input-section">
                <form>
                    <div class="form-field">
                        <label for="form-field__brand">Brand</label>
                        <input
                            id="form-field__brand"
                            type="text"
                            placeholder="Apple"
                            required
                        />
                    </div>

                    <div class="form-field">
                        <label for="form-field__model">Model</label>
                        <input
                            id="form-field__model"
                            type="text"
                            placeholder="IPhone 18 Pro Max"
                            required
                        />
                    </div>

                    <div class="form-field">
                        <label for="form-field__release-year"
                            >Release Year</label
                        >
                        <select name="release-year" id="release-year" required>
                            <option value="" disabled selected>
                                Choose Year
                            </option>
                            <option value="2015">2015</option>
                            <option value="2016">2016</option>
                            <option value="2017">2017</option>
                            <option value="2018">2018</option>
                            <option value="2019">2019</option>
                            <option value="2020">2020</option>
                            <option value="2021">2021</option>
                            <option value="2022">2022</option>
                            <option value="2023">2023</option>
                            <option value="2024">2024</option>
                            <option value="2025">2025</option>
                            <option value="2026">2026</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="form-field__price">Price</label>
                        <input
                            id="form-field__price"
                            type="text"
                            placeholder="$1100"
                            required
                        />
                    </div>

                    <div class="form-field">
                        <label for="form-field__quantity">Quantity</label>
                        <input
                            id="form-field__quantity"
                            type="text"
                            placeholder="5"
                            required
                        />
                    </div>
                    <div class="form-field form-actions">
                        <button id="reset" class="reset" type="reset">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="1em"
                                height="1em"
                                viewBox="0 0 21 21"
                            >
                                <path d="M0 0h21v21H0z" fill="none" />
                                <g
                                    fill="none"
                                    fill-rule="evenodd"
                                    stroke="currentColor"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M3.578 6.487A8 8 0 1 1 2.5 10.5" />
                                    <path d="M7.5 6.5h-4v-4" />
                                </g>
                            </svg>
                        </button>
                        <button id="submit" class="submit" type="submit">
                            Add
                        </button>
                    </div>
                </form>
            </div>
            <div id="outputSection" class="output-section">
                <table>
                    <thead>
                        <tr>
                            <th>Brand</th>
                            <th>Model</th>
                            <th>Release</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th id="actions">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>
            </div>
        </main>
        <footer></footer>
    </body>
</html>
