<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mobile Inventory</title>
        <!-- FAVICON LINK -->
        <link
            rel="icon"
            href="./mobile-inventory-favicon.svg"
            type="image/svg+xml"
        />
        <!-- POPPINS FONT LINK -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
        <!-- LOCAL STYLING LINK -->
        <link rel="stylesheet" href="./styles/main.css" />
    </head>
    <body>
        <header>
            <div class="logo-title">
                <img src="./mobile-inventory-favicon.svg" alt="Logo" />
                <h1 class="page-title">Mobile Inventory</h1>
            </div>
            <button id="darkMode" class="button button--dark-mode">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="1em"
                    height="1em"
                    viewBox="0 0 24 24"
                    class="dark-mode"
                >
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path
                        fill="currentColor"
                        d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26a5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1"
                    />
                </svg>
            </button>
        </header>
        <main>
            <div id="inputSection" class="input-section">
                <form id="input-form">
                    <div class="form-field">
                        <label for="input-brand">Brand</label>
                        <select
                            name="brand"
                            id="brand-select-cell"
                            class="input-field"
                        ></select>
                    </div>

                    <div class="form-field">
                        <label for="input-model">Model</label>
                        <select
                            name="model"
                            id="input-model"
                            class="input-field"
                        ></select>
                    </div>

                    <div class="form-field">
                        <label for="input-price">Price</label>
                        <input
                            class="input-field"
                            id="input-price"
                            type="number"
                            placeholder="$1100"
                            name="price"
                            required
                        />
                    </div>

                    <div class="form-field">
                        <label for="input-quantity">Quantity</label>
                        <input
                            class="input-field"
                            id="input-quantity"
                            type="number"
                            placeholder="5"
                            name="quantity"
                            required
                        />
                    </div>
                    <div class="form-field form-actions">
                        <button id="reset" class="reset" type="reset">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="1em"
                                height="1em"
                                viewBox="0 0 21 21"
                            >
                                <path d="M0 0h21v21H0z" fill="none" />
                                <g
                                    fill="none"
                                    fill-rule="evenodd"
                                    stroke="currentColor"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M3.578 6.487A8 8 0 1 1 2.5 10.5" />
                                    <path d="M7.5 6.5h-4v-4" />
                                </g>
                            </svg>
                        </button>
                        <button id="submit" class="submit" type="submit">
                            Add
                        </button>
                    </div>
                </form>
            </div>
            <div id="outputSection" class="output-section">
                <form id="edit-form"></form>
                <table>
                    <thead>
                        <tr>
                            <th>Brand</th>
                            <th>Model</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th id="actions">Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
        <footer>
            <p>&copy; 2026 Momen T. Abdelhady. All rights reserved.</p>
        </footer>
        <!-- some templates -->
        <template id="edit-template">
            <button
                class="edit-button table-button"
                type="button"
                aria-label="Edit"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M12 20h9" />
                    <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z" />
                </svg>
            </button>
        </template>
        <template id="done-template">
            <button
                class="done-button table-button"
                type="submit"
                aria-label="Done"
                form="edit-form"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="1em"
                    height="1em"
                    viewBox="0 0 24 24"
                >
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path
                        fill="currentColor"
                        d="M9 16.2L4.8 12l-1.4 1.4L9 19L21 7l-1.4-1.4z"
                    />
                </svg>
            </button>
        </template>
        <template id="delete-template">
            <button
                class="delete-button table-button"
                type="button"
                aria-label="Delete"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M3 6h18" />
                    <path d="M8 6V4h8v2" />
                    <path d="m19 6-1 14H6L5 6" />
                    <path d="M10 11v5" />
                    <path d="M14 11v5" />
                </svg>
            </button>
        </template>

        <template id="cancel-template">
            <button
                class="cancel-button table-button"
                type="button"
                aria-label="Cancel"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="1em"
                    height="1em"
                    viewBox="0 0 1024 1024"
                >
                    <path d="M0 0h1024v1024H0z" fill="none" />
                    <path
                        fill="currentColor"
                        fill-rule="evenodd"
                        d="M799.855 166.312c.023.007.043.018.084.059l57.69 57.69c.041.041.052.06.059.084a.1.1 0 0 1 0 .069c-.007.023-.018.042-.059.083L569.926 512l287.703 287.703c.041.04.052.06.059.083a.12.12 0 0 1 0 .07c-.007.022-.018.042-.059.083l-57.69 57.69c-.041.041-.06.052-.084.059a.1.1 0 0 1-.069 0c-.023-.007-.042-.018-.083-.059L512 569.926L224.297 857.629c-.04.041-.06.052-.083.059a.12.12 0 0 1-.07 0c-.022-.007-.042-.018-.083-.059l-57.69-57.69c-.041-.041-.052-.06-.059-.084a.1.1 0 0 1 0-.069c.007-.023.018-.042.059-.083L454.073 512L166.371 224.297c-.041-.04-.052-.06-.059-.083a.12.12 0 0 1 0-.07c.007-.022.018-.042.059-.083l57.69-57.69c.041-.041.06-.052.084-.059a.1.1 0 0 1 .069 0c.023.007.042.018.083.059L512 454.073l287.703-287.702c.04-.041.06-.052.083-.059a.12.12 0 0 1 .07 0Z"
                    />
                </svg>
            </button>
        </template>
        <script type="module" src="./src/main.js"></script>
    </body>
</html>
